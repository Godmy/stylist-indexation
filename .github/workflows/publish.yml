# Stages a GitHub release on npm. Nothing becomes installable until a
# maintainer approves the staged version with 2FA (see RELEASING.md).
name: Stage release
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # trusted publishing (OIDC): no npm token is stored
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # No dependency cache in release builds.
      # npm stage needs npm 11.15+; trusted publishing adds provenance.
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run check
      - run: npm test
      # prepack builds dist/ into the staged tarball.
      - run: npm stage publish
